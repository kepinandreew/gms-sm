name: Keep Supabase Alive

on:
  schedule:
    # Berjalan setiap 2 hari sekali pada jam 00:00 UTC (07:00 WIB)
    - cron: '0 0 */2 * *'
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual di GitHub Actions UI

jobs:
  ping-supabase:
    name: Ping & Heartbeat Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive requests to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://offbywvstsbidxxbtozl.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9mZmJ5d3ZzdHNiaWR4eGJ0b3psIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4OTM5OTUsImV4cCI6MjEwMTQ2OTk5NX0.fZ9RjI-9-WmaPV1E71DFGwTKTY0a6_gNxrYGBrKNZo4' }}
        run: |
          echo "1. Mengirim READ query ke Supabase..."
          TIMESTAMP=$(date +%s)
          GET_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Cache-Control: no-cache, no-store" \
            -H "Pragma: no-cache" \
            "$SUPABASE_URL/rest/v1/teams?select=id&limit=1&_t=$TIMESTAMP")

          echo "Status Read Query: $GET_STATUS"

          echo "2. Mengirim WRITE transaction (heartbeat) agar tidak ter-cache..."
          NOW_ISO=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          WRITE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"updated_at\": \"$NOW_ISO\"}" \
            "$SUPABASE_URL/rest/v1/engine_settings?id=eq.default")

          echo "Status Write Heartbeat: $WRITE_STATUS"

          if [ "$GET_STATUS" -ge 200 ] && [ "$GET_STATUS" -lt 300 ]; then
            echo "✅ Ping berhasil! Database Supabase aktif dan ter-refresh."
          else
            echo "❌ Ping gagal. Database mungkin sedang paused di Supabase Dashboard (Status: $GET_STATUS)"
            exit 1
          fi
